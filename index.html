<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Java Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Animation Orbs -->
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <nav>
        <div class="container nav-content">
            <a href="#home" class="logo" id="nav-logo">DevName</a>
            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
                <button class="theme-toggle" id="theme-btn" aria-label="Toggle Theme">
                    <!-- Icon will be injected by JS -->
                </button>
            </div>
        </div>
    </nav>

    <main>
        <!-- Hero Section -->
        <section id="home" class="container">
            <div class="hero-text">
                <h3 id="hero-greeting">Hi, I'm</h3>
                <h1 id="hero-name">Name</h1>
                <h2 id="hero-role">Role</h2>
                <p id="hero-bio" style="margin-bottom: 2rem;"></p>
                <a href="#contact" class="btn">Get In Touch</a>
            </div>
            <div class="hero-image-container">
                <div class="image-placeholder" id="hero-image-box">
                    <!-- Image dynamically added if URL is provided in config -->
                </div>
            </div>
        </section>

        <!-- About Section -->
        <section id="about" class="container">
            <h2 class="section-title">About Me</h2>
            <div class="about-content">
                <div class="about-text">
                    <p id="about-description">Description goes here...</p>
                </div>
                <div class="skills-container">
                    <h3>My Skills</h3>
                    <div class="skills-grid" id="skills-grid">
                        <!-- Skills injected by JS -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Projects Section -->
        <section id="projects" class="container">
            <h2 class="section-title">Featured Projects</h2>
            <div class="projects-grid" id="projects-grid">
                <!-- Projects injected by JS -->
            </div>
        </section>

        <!-- Contact Section -->
        <section id="contact" class="container">
            <h2 class="section-title">Contact</h2>
            <div class="contact-content">
                <p id="contact-message">Contact message...</p>
                
                <div class="contact-details">
                    <div class="contact-item">
                        <svg viewBox="0 0 24 24"><path d="M20,4H4C2.897,4,2,4.897,2,6v12c0,1.103,0.897,2,2,2h16c1.103,0,2-0.897,2-2V6C22,4.897,21.103,4,20,4z M20,6v0.511l-8,6.223L4,6.512V6H20z M4,18V9.044l7.386,5.745C11.566,14.93,11.783,15,12,15s0.434-0.07,0.614-0.211L20,9.044L20.002,18H4z"/></svg>
                        <span id="contact-email">fadadukunj04@gmail.com</span>
                    </div>
                    <div class="contact-item">
                        <svg viewBox="0 0 24 24"><path d="M20,15.61l-3.21-1.61c-0.4-0.2-0.9-0.1-1.2,0.2l-1.39,1.72c-2.73-1.39-5.02-3.68-6.41-6.41l1.72-1.39 c0.3-0.3,0.4-0.8,0.2-1.2L8.1,3.71C7.8,3.31,7.3,3.11,6.9,3.21L3.3,3.91C2.6,4.01,2,4.71,2,5.51C2,15.21,9.8,23,19.5,23 c0.8,0,1.5-0.6,1.6-1.3l0.7-3.6C21.9,17.71,21.7,17.21,21.3,16.91L20,15.61z"/></svg>
                        <span id="contact-phone">+91 93272 93750</span>
                    </div>
                </div>
                
                <a href="#" id="mailto-btn" class="btn">Send an Email</a>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="year"></span> <span id="footer-name"></span>. All rights reserved.</p>
        </div>
    </footer>

    <!-- Link to external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
